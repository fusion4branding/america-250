<style>
  .a250-catalog-page {
    font-family: Arial, Helvetica, sans-serif;
    color: #20285f;
    background: #ffffff;
  }

  .a250-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .a250-catalog-hero {
    position: relative;
    background: #20285f;
    color: #ffffff;
    text-align: center;
    padding: 90px 20px;
    overflow: hidden;
  }

  #a250CatalogFireworks {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  .a250-catalog-hero-content {
    position: relative;
    z-index: 2;
  }

  .a250-kicker {
    color: #ed1c24;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0 0 12px;
  }

  .a250-catalog-hero h1 {
    font-size: clamp(42px, 7vw, 82px);
    line-height: 1;
    text-transform: uppercase;
    margin: 0 0 20px;
    font-weight: 900;
  }

  .a250-catalog-hero p {
    max-width: 780px;
    margin: 0 auto;
    font-size: 21px;
    line-height: 1.6;
  }

  .a250-catalog-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    padding: 70px 0;
  }

  .a250-catalog-card {
    background: #ffffff;
    border: 2px solid #eeeeee;
    border-radius: 20px;
    padding: 22px 18px 26px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .a250-catalog-card:hover {
    transform: translateY(-8px);
    border-color: #ed1c24;
    box-shadow: 0 22px 48px rgba(0,0,0,0.16);
  }

  .a250-catalog-card img {
    width: 100%;
    height: 175px;
    object-fit: contain;
    margin-bottom: 16px;
    transition: transform 0.25s ease;
  }

  .a250-catalog-card:hover img {
    transform: scale(1.06);
  }

  .a250-catalog-card h3 {
    font-size: 19px;
    font-weight: 900;
    color: #20285f;
    margin: 0 0 10px;
    min-height: 48px;
  }

  .a250-item-number {
    font-size: 14px;
    color: #666666;
    font-weight: 800;
    margin: 0 0 8px;
  }

  .a250-price {
    color: #ed1c24 !important;
    font-size: 20px !important;
    font-weight: 900 !important;
    margin: 8px 0 6px !important;
  }

  .a250-disclaimer {
    color: #666666 !important;
    font-size: 12px !important;
    line-height: 1.4 !important;
    margin: 0 0 16px !important;
  }

  .a250-catalog-card a,
  .a250-catalog-contact a {
    display: inline-block;
    background: #ed1c24;
    color: #ffffff;
    text-decoration: none;
    padding: 11px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
  }

  .a250-catalog-card a:hover,
  .a250-catalog-contact a:hover {
    background: #20285f;
    color: #ffffff;
  }

  .a250-catalog-contact {
    background: #ed1c24;
    color: #ffffff;
    text-align: center;
    padding: 70px 20px;
  }

  .a250-catalog-contact h2 {
    font-size: 40px;
    font-weight: 900;
    margin: 0 0 15px;
  }

  .a250-catalog-contact p {
    font-size: 21px;
    margin: 0 0 24px;
  }

  .a250-catalog-contact a {
    background: #ffffff;
    color: #20285f;
  }

  .a250-catalog-contact a:hover {
    background: #20285f;
    color: #ffffff;
  }

  @media (max-width: 1024px) {
    .a250-catalog-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 600px) {
    .a250-catalog-grid {
      grid-template-columns: 1fr;
    }

    .a250-catalog-card img {
      height: 165px;
    }
  }
</style>

<script>

    { name: "Patriotic Outdoor Folding Chair", item: "VMDHH-NUQSO", price: "29.95", img: "https://i.imgur.com/FXSVwLS.jpeg" },
    { name: "Silver Tombstone Key Tag", item: "JLADK-LQYCV", price: "5.60", img: "https://i.imgur.com/RnvGFJi.jpeg" }
  ];

  const catalogGrid = document.getElementById("a250CatalogGrid");

  a250Products.forEach(product => {
    const card = document.createElement("div");
    card.className = "a250-catalog-card";
    card.innerHTML = `
      <img src="${product.img}" alt="${product.name.replace(/&quot;/g, '"')}">
      <h3>${product.name}</h3>
      <p class="a250-item-number">Item # ${product.item}</p>
      <p class="a250-price">As low as $${product.price}</p>
      <p class="a250-disclaimer">
        Price excludes set up and shipping<br>
        Products offered while supplies last
      </p>
      <a href="#contact">Request Quote</a>
    `;
    catalogGrid.appendChild(card);
  });

  (function () {
    var canvas = document.getElementById("a250CatalogFireworks");
    if (!canvas) return;

    var ctx = canvas.getContext("2d");
    var fireworks = [];
    var particles = [];

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function Firework() {
      this.x = random(80, canvas.width - 80);
      this.y = canvas.height;
      this.targetY = random(60, canvas.height / 2);
      this.speed = random(4, 7);
      this.color = ["#ed1c24", "#ffffff", "#3b82f6"][Math.floor(Math.random() * 3)];
    }

    Firework.prototype.update = function () {
      this.y -= this.speed;
      if (this.y <= this.targetY) {
        this.explode();
        return true;
      }
      return false;
    };

    Firework.prototype.draw = function () {
      ctx.beginPath();
      ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.fill();
    };

    Firework.prototype.explode = function () {
      for (var i = 0; i < 45; i++) {
        particles.push(new Particle(this.x, this.y, this.color));
      }
    };

    function Particle(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      this.angle = random(0, Math.PI * 2);
      this.speed = random(1, 5);
      this.alpha = 1;
      this.decay = random(0.01, 0.025);
    }

    Particle.prototype.update = function () {
      this.x += Math.cos(this.angle) * this.speed;
      this.y += Math.sin(this.angle) * this.speed;
      this.alpha -= this.decay;
    };

    Particle.prototype.draw = function () {
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.fill();
      ctx.restore();
    };

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (Math.random() < 0.035) {
        fireworks.push(new Firework());
      }

      fireworks = fireworks.filter(function (firework) {
        firework.draw();
        return !firework.update();
      });

      particles = particles.filter(function (particle) {
        particle.update();
        particle.draw();
        return particle.alpha > 0;
      });

      requestAnimationFrame(animate);
    }

    animate();
  })();
</script>
